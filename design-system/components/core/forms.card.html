<!doctype html><html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{padding:20px;background:var(--surface-card)}.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.stack{display:grid;gap:14px}.lbl{font:var(--fw-bold) var(--fs-overline) var(--font-sans);letter-spacing:var(--ls-overline);text-transform:uppercase;color:var(--text-subtle)}</style>
</head><body><div id="root"></div>
<script type="text/babel">
const { Input, Select, Textarea, Checkbox, Radio, Switch, SearchField } = window.WaykaDesignSystem_51ee47;
function Demo(){const[c,setC]=React.useState(true);const[s,setS]=React.useState(true);const[r,setR]=React.useState('oral');
return(<div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:20}}>
<div className="stack">
<Input label="Peso" suffix="kg" defaultValue="8,4" icon="scale" />
<Input label="Microchip" defaultValue="982000" error="Debe tener 15 dígitos" />
<Select label="Especie" options={['Canino','Felino','Otro']} />
<SearchField />
</div>
<div className="stack">
<Textarea label="Observaciones" rows={3} defaultValue="Buen estado general. Control en 15 días." />
<Input label="Indicado por" defaultValue="Dra. A. Rossi" readOnly hint="Solo lectura: dato clínico" />
<div className="stack" style={{gap:10}}>
<Checkbox label="Notificar al tutor" description="Envía la novedad a la app" checked={c} onChange={()=>setC(!c)} />
<div className="row" style={{gap:20}}><Radio name="via" label="Oral" checked={r==='oral'} onChange={()=>setR('oral')} /><Radio name="via" label="Inyectable" checked={r==='iny'} onChange={()=>setR('iny')} /></div>
<Switch checked={s} onChange={setS} label="Recordatorios activos" />
</div></div></div>)}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script></body></html>
