<!doctype html><html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:20px;background:var(--surface-card)}.row{display:flex;gap:12px;flex-wrap:wrap}.sw{border-radius:var(--radius-sm);height:64px;flex:1;min-width:92px;display:flex;align-items:flex-end;padding:8px;font:var(--fw-semibold) 11px/1.2 var(--font-sans)}.lbl{font:var(--fw-medium) 11px/1.3 var(--font-sans);color:var(--text-subtle);margin-top:6px}.cell{flex:1;min-width:92px}</style></head><body><div class="row"><div class="cell" style="min-width:180px;background:var(--appt-pending-surface);border-radius:var(--radius-sm);padding:12px;display:flex;gap:10px;align-items:center"><span style="width:10px;height:10px;border-radius:50%;background:var(--appt-pending)"></span><div><div style="font:var(--text-body-strong);color:var(--text-strong)">Pendiente</div><div style="font:var(--fs-caption) var(--font-sans);color:var(--text-muted)">--appt-pending</div></div></div><div class="cell" style="min-width:180px;background:var(--appt-done-surface);border-radius:var(--radius-sm);padding:12px;display:flex;gap:10px;align-items:center"><span style="width:10px;height:10px;border-radius:50%;background:var(--appt-done)"></span><div><div style="font:var(--text-body-strong);color:var(--text-strong)">Cumplido</div><div style="font:var(--fs-caption) var(--font-sans);color:var(--text-muted)">--appt-done</div></div></div><div class="cell" style="min-width:180px;background:var(--appt-overdue-surface);border-radius:var(--radius-sm);padding:12px;display:flex;gap:10px;align-items:center"><span style="width:10px;height:10px;border-radius:50%;background:var(--appt-overdue)"></span><div><div style="font:var(--text-body-strong);color:var(--text-strong)">Vencido</div><div style="font:var(--fs-caption) var(--font-sans);color:var(--text-muted)">--appt-overdue</div></div></div></div></body></html>
