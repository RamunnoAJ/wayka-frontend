<!doctype html><html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:20px;background:var(--surface-card)}.row{display:flex;gap:12px;flex-wrap:wrap}.sw{border-radius:var(--radius-sm);height:64px;flex:1;min-width:92px;display:flex;align-items:flex-end;padding:8px;font:var(--fw-semibold) 11px/1.2 var(--font-sans)}.lbl{font:var(--fw-medium) 11px/1.3 var(--font-sans);color:var(--text-subtle);margin-top:6px}.cell{flex:1;min-width:92px}</style></head><body><div class="row"><div class="cell"><div class="sw" style="background:var(--surface-page);border:1px solid var(--border-default);color:#1E1428">page</div><div class="lbl">surface-page</div></div><div class="cell"><div class="sw" style="background:var(--surface-card);border:1px solid var(--border-default);color:#1E1428">card</div><div class="lbl">surface-card</div></div><div class="cell"><div class="sw" style="background:var(--surface-sunken);border:1px solid var(--border-default);color:#1E1428">sunken</div><div class="lbl">surface-sunken</div></div><div class="cell"><div class="sw" style="background:var(--surface-brand-soft);border:1px solid var(--border-default);color:#1E1428">brand-soft</div><div class="lbl">surface-brand-soft</div></div><div class="cell"><div class="sw" style="background:var(--surface-accent-soft);border:1px solid var(--border-default);color:#1E1428">accent-soft</div><div class="lbl">surface-accent-soft</div></div><div class="cell"><div class="sw" style="background:var(--surface-nav);color:#fff">nav</div><div class="lbl">surface-nav</div></div><div class="cell"><div class="sw" style="background:var(--surface-inverse);color:#fff">inverse</div><div class="lbl">surface-inverse</div></div></div></body></html>
