<!doctype html><html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:20px;background:var(--surface-card)}.row{display:flex;gap:12px;flex-wrap:wrap}.sw{border-radius:var(--radius-sm);height:64px;flex:1;min-width:92px;display:flex;align-items:flex-end;padding:8px;font:var(--fw-semibold) 11px/1.2 var(--font-sans)}.lbl{font:var(--fw-medium) 11px/1.3 var(--font-sans);color:var(--text-subtle);margin-top:6px}.cell{flex:1;min-width:92px}</style></head><body>
