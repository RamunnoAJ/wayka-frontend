<!doctype html><html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:20px;background:var(--surface-card)}.row{display:flex;gap:12px;flex-wrap:wrap}.sw{border-radius:var(--radius-sm);height:64px;flex:1;min-width:92px;display:flex;align-items:flex-end;padding:8px;font:var(--fw-semibold) 11px/1.2 var(--font-sans)}.lbl{font:var(--fw-medium) 11px/1.3 var(--font-sans);color:var(--text-subtle);margin-top:6px}.cell{flex:1;min-width:92px}</style></head><body><div class="row"><div class="cell"><div class="sw" style="background:var(--neutral-0);color:#1E1428">0</div><div class="lbl">neutral-0</div></div><div class="cell"><div class="sw" style="background:var(--neutral-50);color:#1E1428">50</div><div class="lbl">neutral-50</div></div><div class="cell"><div class="sw" style="background:var(--neutral-100);color:#1E1428">100</div><div class="lbl">neutral-100</div></div><div class="cell"><div class="sw" style="background:var(--neutral-200);color:#1E1428">200</div><div class="lbl">neutral-200</div></div><div class="cell"><div class="sw" style="background:var(--neutral-300);color:#1E1428">300</div><div class="lbl">neutral-300</div></div><div class="cell"><div class="sw" style="background:var(--neutral-400);color:#1E1428">400</div><div class="lbl">neutral-400</div></div><div class="cell"><div class="sw" style="background:var(--neutral-500);color:#fff">500</div><div class="lbl">neutral-500</div></div><div class="cell"><div class="sw" style="background:var(--neutral-600);color:#fff">600</div><div class="lbl">neutral-600</div></div><div class="cell"><div class="sw" style="background:var(--neutral-700);color:#fff">700</div><div class="lbl">neutral-700</div></div><div class="cell"><div class="sw" style="background:var(--neutral-900);color:#fff">900</div><div class="lbl">neutral-900</div></div></div></body></html>
