<!-- @dsCard group="Web clínica" viewport="1440x900" name="Web de la clínica" subtitle="Login, pacientes, ficha, agenda y panel — click-through" -->
<!doctype html><html lang="es"><head><meta charset="utf-8"><title>Wayka · Web de la clínica</title><link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script src="data.js"></script>
<style>html,body{height:100%}#root{height:100vh}</style>
</head><body><div id="root"></div>
<script type="text/babel" src="Login.jsx"></script>
<script type="text/babel" src="Patients.jsx"></script>
<script type="text/babel" src="PatientDetail.jsx"></script>
<script type="text/babel" src="Agenda.jsx"></script>
<script type="text/babel" src="ClinicPanel.jsx"></script>
<script type="text/babel" src="EventForm.jsx"></script>
<script type="text/babel">
const { SidebarNav, Toast, IconButton } = window.WaykaDesignSystem_51ee47;
const NAV=[{value:'agenda',label:'Agenda',icon:'calendar-days',badge:5},{value:'pacientes',label:'Pacientes',icon:'paw-print'},{value:'clinica',label:'Panel de clínica',icon:'building-2'}];

function App(){
  const [authed,setAuthed]=React.useState(true);
  const [section,setSection]=React.useState('pacientes');
  const [openId,setOpenId]=React.useState(null);
  const [form,setForm]=React.useState(false);
  const [toast,setToast]=React.useState(false);
  const patient = window.WaykaData.patients.find(p=>p.id===openId);

  if(!authed) return <LoginScreen onLogin={()=>setAuthed(true)} />;
  return (
    <div style={{display:'flex',height:'100%',background:'var(--surface-page)'}}>
      <SidebarNav items={NAV} value={section} onChange={v=>{setSection(v);setOpenId(null);}}
        clinic="Veterinaria San Roque" user={window.WaykaData.user} logoSrc="../../assets/wayka-logo.svg" />
      <main style={{flex:1,minWidth:0,overflow:'auto'}}>
        <div style={{padding:'var(--space-5) var(--gutter-page) var(--space-9)',maxWidth:'var(--content-max)',margin:'0 auto'}}>
          <div style={{display:'flex',justifyContent:'flex-end',gap:4,marginBottom:'var(--space-3)'}}>
            <IconButton icon="bell" label="Notificaciones" />
            <IconButton icon="log-out" label="Salir" onClick={()=>setAuthed(false)} />
          </div>
          {section==='pacientes' && (patient
            ? <PatientDetail patient={patient} onBack={()=>setOpenId(null)} onNewEvent={()=>setForm(true)} />
            : <PatientsScreen onOpen={setOpenId} />)}
          {section==='agenda' && <AgendaScreen />}
          {section==='clinica' && <ClinicPanel />}
        </div>
      </main>
      <EventFormDialog open={form} patientName={patient?patient.name:'—'} onClose={()=>setForm(false)}
        onSave={()=>{setForm(false);setToast(true);setTimeout(()=>setToast(false),3200);}} />
      {toast && <div style={{position:'fixed',right:24,bottom:24,zIndex:80}}>
        <Toast tone="success" title="Evento guardado" description="Se notificó al tutor." onClose={()=>setToast(false)} /></div>}
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script></body></html>
