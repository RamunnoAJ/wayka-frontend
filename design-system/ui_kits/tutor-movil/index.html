<!doctype html><html lang="es"><head><meta charset="utf-8"><title>Wayka · App del tutor</title><link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script src="../clinica-web/data.js"></script>
<style>body{display:grid;place-items:center;min-height:100vh;background:var(--neutral-100);padding:28px}
.phones{display:flex;gap:28px;align-items:flex-start}
.phone{width:372px;height:700px;background:var(--surface-page);border:10px solid var(--wayka-oscuro);border-radius:38px;overflow:hidden;display:flex;flex-direction:column;box-shadow:var(--shadow-lg)}
.phone .scroll{flex:1;overflow:auto}
.cap{font:var(--fw-semibold) var(--fs-caption) var(--font-sans);color:var(--text-subtle);text-align:center;margin-top:10px}</style>
</head><body data-theme="tutor"><div id="root"></div>
<script type="text/babel" src="TutorScreens.jsx"></script>
<script type="text/babel">
const { MobileHeader, MobileTabBar, IconButton } = window.WaykaDesignSystem_51ee47;
function App(){
  const [authed,setAuthed]=React.useState(true);
  const [tab,setTab]=React.useState('mascotas');
  const [openId,setOpenId]=React.useState(null);
  const pet = window.WaykaData.patients.find(p=>p.id===openId);
  const titles={mascotas:'Mis mascotas',agenda:'Citas',perfil:'Perfil'};
  return (
    <div className="phones">
      <div>
        <div className="phone">
          {authed ? <>
            {!pet && <MobileHeader title={titles[tab]} tone="dark" action={<IconButton icon="bell" label="Avisos" variant="on-dark" />} />}
            {pet && <MobileHeader title="" tone="dark" onBack={()=>setOpenId(null)} action={<IconButton icon="share-2" label="Compartir" variant="on-dark" />} />}
            <div className="scroll">
              {pet ? <TutorPetDetail patient={pet} />
                : tab==='mascotas' ? <TutorPets onOpen={setOpenId} />
                : tab==='agenda' ? <TutorAgenda /> : <TutorProfile />}
            </div>
            <MobileTabBar items={window.TUTOR_TABS} value={tab} onChange={v=>{setTab(v);setOpenId(null);}} />
          </> : <TutorLogin onLogin={()=>setAuthed(true)} />}
        </div>
        <div className="cap">Navegable · tocá una mascota</div>
      </div>
      <div>
        <div className="phone"><TutorLogin onLogin={()=>{}} /></div>
        <div className="cap">Ingreso del tutor</div>
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script></body></html>
